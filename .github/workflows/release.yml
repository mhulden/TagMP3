name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-build:
    name: Unsigned universal macOS build
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build universal unsigned app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project TagMP3/TagMP3.xcodeproj \
            -scheme TagMP3 \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TagMP3DerivedData" \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify slices and package
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/TagMP3DerivedData/Build/Products/Release/TagMP3.app"
          binary="$app/Contents/MacOS/TagMP3"
          test -d "$app"
          lipo -info "$binary"
          lipo "$binary" -verify_arch x86_64 arm64
          ditto -c -k --sequesterRsrc --keepParent "$app" TagMP3-macos-universal.zip
          shasum -a 256 TagMP3-macos-universal.zip > TagMP3-macos-universal.zip.sha256

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TagMP3-macos-universal-unsigned
          path: |
            TagMP3-macos-universal.zip
            TagMP3-macos-universal.zip.sha256
