name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-tests:
    name: macOS tests
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Run package and Xcode tests
        run: ./scripts/test.sh
